name: GeoViz local checks
on: [push, pull_request, workflow_dispatch]
jobs:
  showcase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.16'
          python-version: '3.12'
      - run: uv sync --locked
      - run: npm --prefix frontend ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix frontend run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: npm --prefix frontend run typecheck
      - run: node scripts/check_science.mjs
      - run: uv run --locked python -B scripts/check_backend.py
      - run: uv run --locked python -B scripts/check_repository.py
      - name: Retained lint diagnostics
        continue-on-error: true
        run: npm --prefix frontend run lint
