[project]
name = "geoviz-showcase"
version = "0.1.0"
description = "Geochronology visualization, sample exploration and source provenance"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "python-dotenv>=1",
  "networkx>=3.4", "openai>=2", "pymupdf==1.26.3", "pillow>=10", "openpyxl>=3.1"]

[project.optional-dependencies]
retrieval = ["chromadb>=1", "google-genai>=1"]

[tool.uv]
package = false
